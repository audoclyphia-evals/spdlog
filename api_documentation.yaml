openapi: 3.0.3
info:
  title: API Documentation
  description: Auto-generated API documentation
  version: 1.0.0
paths:
  'logger with name ':
    get:
      summary: Retrieve a logger by name
      description: Gets a logger instance from the central registry using its unique
        name.
      operationId: getLoggerByName
      tags:
      - Registry
      responses:
        '200':
          description: Logger found and returned
        '404':
          description: Logger not found
        '500':
          description: Internal server error
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: Name of the logger to retrieve
  registry.get_default_raw [GET]:
    get:
      summary: Retrieves raw pointer to default logger
      description: Returns the raw pointer to the default logger instance managed
        by the registry.
      operationId: getDefaultRaw
      tags:
      - Registry
      responses:
        '200':
          description: Success
        '500':
          description: Internal server error
  abc:
    get:
      summary: Provides a dynamic list of formatting arguments with storage
      description: Returns a dynamic store of formatting arguments that can be converted
        into basic_format_args for type-erased formatting functions such as fmt::vformat.
      operationId: getDynamicFormatArgStore
      tags:
      - Formatting
      responses:
        '200':
          description: Success
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
  push_back [GET]:
    get:
      summary: Appends a reference-wrapped argument to the storage
      description: Appends a reference-wrapped argument to the storage, ensuring type
        safety
      operationId: appendReferenceWrappedArgument
      tags:
      - Storage
      responses:
        '200':
          description: Success
        '400':
          description: Bad request
        '500':
          description: Internal server error
  ' ':
    put:
      summary: Write formatted time data to a buffer using locale-specific facets
      description: Writes a formatted time structure to a buffer, using the time_put
        facet of the provided locale for locale-specific formatting.
      operationId: writeFormattedTimeToBuffer
      tags:
      - TimeFormatting
      responses:
        '200':
          description: Time data formatted and written to buffer successfully
        '400':
          description: Bad request due to invalid format or modifier
        '401':
          description: Unauthorized
        '500':
          description: Internal server error during formatting
      parameters:
      - name: format
        in: query
        required: true
        schema:
          type: string
        description: Format character for time formatting
      - name: modifier
        in: query
        required: true
        schema:
          type: string
        description: Modifier character for time formatting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - time
              - locale
              properties:
                time:
                  type: object
                  description: Time structure (std::tm) with date/time fields
                locale:
                  type: object
                  description: Locale object for formatting, convertible to std::locale
            example:
              time:
                tm_year: 124
                tm_mon: 0
                tm_mday: 15
                tm_hour: 10
                tm_min: 30
                tm_sec: 0
              locale: {}
  vformat_to [GET]:
    get:
      summary: Formats arguments into a buffer using a format string
      description: Formats arguments into a buffer using a format string
      operationId: vformatTo
      tags:
      - Formatting
      responses:
        '200':
          description: Success
        '400':
          description: Bad request
        '500':
          description: Internal server error
      parameters:
      - name: buf
        in: query
        required: true
        schema:
          type: string
        description: Output buffer for formatted result
      - name: fmt
        in: query
        required: true
        schema:
          type: string
        description: Format string
      - name: args
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
        description: Format arguments
      - name: loc
        in: query
        required: false
        schema:
          type: string
        description: Locale reference
  FMT_BEGIN_EXPORT [GET]:
    get:
      summary: Retrieve a formatted printf argument by ID
      description: Returns the format argument at the specified index from the printf
        context.
      operationId: getPrintfArg
      tags:
      - PrintfContext
      responses:
        '200':
          description: Successfully retrieved argument
        '400':
          description: Invalid argument ID
        '500':
          description: Internal server error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Argument index to retrieve
  arg [GET]:
    get:
      summary: Retrieve a formatted argument by ID
      description: Returns the formatted argument associated with the given ID from
        the printf context
      operationId: getFormattedArgumentById
      tags:
      - Formatting
      responses:
        '200':
          description: Retrieved formatted argument successfully
        '400':
          description: Invalid ID
        '404':
          description: Argument not found
        '500':
          description: Internal server error
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Identifier of the argument to retrieve
  format [GET]:
    get:
      summary: Formats reference_wrapper types by delegating to the underlying type's
        formatter
      description: Formats a given std::reference_wrapper by unwrapping it and using
        the formatter for the underlying type
      operationId: formatReferenceWrapper
      tags:
      - Formatters
      responses:
        '200':
          description: Formatted output iterator
        '400':
          description: Invalid reference wrapper or context
        '500':
          description: Internal formatting error
      parameters:
      - name: ref
        in: query
        required: true
        schema:
          type: object
          description: std::reference_wrapper<T> instance
        description: Reference wrapper to format
      - name: ctx
        in: query
        required: true
        schema:
          type: object
          description: FormatContext for output
        description: Format context providing output iterator
  'std::':
    get:
      summary: Namespace containing type traits and utilities for formatting standard
        library types
      description: Namespace containing type traits and utilities for formatting standard
        library types such as filesystem paths, variants, and error codes.
      operationId: getStdNamespace
      tags:
      - Standard Library
      - Formatting
      responses:
        '200':
          description: Successfully retrieved namespace information
        '404':
          description: Namespace not found
        '500':
          description: Internal server error
  ptr [GET]:
    get:
      summary: Returns pointer value from unique_ptr for formatting
      description: Retrieves and formats the raw pointer value from a unique_ptr for
        display or logging purposes.
      operationId: getPointerValue
      tags:
      - Formatting
      responses:
        '200':
          description: Pointer value formatted successfully
        '400':
          description: Invalid pointer value
        '500':
          description: Internal server error
      parameters:
      - name: pointer
        in: query
        required: true
        schema:
          type: string
        description: The pointer value to format
  write_demangled_name [GET]:
    get:
      summary: Writes demangled C++ type names with platform-specific normalization
      description: Returns the demangled and normalized name of a C++ type, applying
        platform-specific transformations for libc++ and MSVC ABIs.
      operationId: writeDemangledName
      tags:
      - Demangling
      responses:
        '200':
          description: Demangled type name successfully returned
        '400':
          description: Invalid or missing type_name parameter
        '500':
          description: Internal demangling failure
      parameters:
      - name: type_name
        in: query
        required: true
        schema:
          type: string
        description: The mangled C++ type name to demangle
  log [GET]:
    get:
      summary: Log a formatted message
      description: Public endpoint to format and log a message using the logger
      operationId: logMessage
      tags:
      - Logging
      responses:
        '200':
          description: Message logged successfully
        '400':
          description: Invalid parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      parameters:
      - name: level
        in: query
        required: true
        schema:
          type: string
          enum:
          - trace
          - debug
          - info
          - warn
          - error
          - critical
        description: Log level
      - name: message
        in: query
        required: true
        schema:
          type: string
        description: Format string message
      - name: file
        in: query
        required: false
        schema:
          type: string
        description: Source file for logging
      - name: line
        in: query
        required: false
        schema:
          type: integer
        description: Source line number
  logger [GET]:
    get:
      summary: Defines the Logger class, the central component for managing log messages,
        levels, and sinks
      description: Provides the complete definition of the Logger class including
        constructors, logging methods, and sink management.
      operationId: getLoggerDefinition
      tags:
      - Logger
      responses:
        '200':
          description: Logger class definition
  bootstrap.servers:
    get:
      summary: Retrieve current Kafka bootstrap servers configuration
      description: Returns the list of Kafka bootstrap servers currently configured
        for the sink.
      operationId: getBootstrapServers
      tags:
      - Kafka
      - Configuration
      responses:
        '200':
          description: Successfully retrieved bootstrap servers
        '400':
          description: Bad request
        '500':
          description: Internal server error
  sink_it [GET]:
    get:
      summary: Sink log message to Kafka topic
      description: Produces a log message to the configured Kafka topic via the sink
        implementation.
      operationId: sinkLogMessage
      tags:
      - Logging
      responses:
        '200':
          description: Message successfully sunk to Kafka
        '400':
          description: Invalid message format or missing parameter
        '401':
          description: Unauthorized
        '500':
          description: Internal server error during message production
      parameters:
      - name: message
        in: query
        required: true
        schema:
          type: string
        description: The log message payload to be produced
  std.shared_ptr_logger_get [GET]:
    get:
      summary: Retrieves a logger instance by name from the registry
      description: Returns a shared pointer to the logger associated with the given
        name from the global registry
      operationId: getLoggerByName
      tags:
      - Logger
      responses:
        '200':
          description: Logger instance retrieved successfully
        '404':
          description: Logger not found
        '500':
          description: Internal server error
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
        description: Name of the logger to retrieve
  write_loc [PUT]:
    put:
      summary: Writes localized number formatting to output
      description: Formats a number according to locale specifications and writes
        the result
      operationId: writeLoc
      tags:
      - Formatting
      responses:
        '200':
          description: Formatting succeeded
        '400':
          description: Invalid input parameters
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - value
              - specs
              - loc
              properties:
                value:
                  type: number
                  description: The numeric value to format
                specs:
                  type: object
                  description: Formatting specifications (precision, grouping, etc.)
                loc:
                  type: string
                  description: Locale identifier (e.g., 'en_US')
            example:
              value: 1234.56
              specs:
                precision: 2
                grouping: true
              loc: de_DE
tags:
- name: Configuration
- name: Demangling
- name: Formatters
- name: Formatting
- name: Kafka
- name: Logger
- name: Logging
- name: PrintfContext
- name: Registry
- name: Standard Library
- name: Storage
- name: TimeFormatting